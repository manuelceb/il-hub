<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub login</title>
</head>
<body>
    <main>
        <h1>IL-Hub login</h1>

        {% if user.is_authenticated %}
            <p>
                User is already logged in to IL-Hub as {{ display_name }}.
            </p>

            <form method="post" action="{% url 'hub:logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            {% if form.errors %}
                <p>Your email and password did not match. Please try again.</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Log in</button>
            </form>
        {% endif %}
    </main>
</body>
</html>
