<section>
    <h2>IL-Hub Profile</h2>

    <dl>
        <dt>Email</dt>
        <dd>{{ user.email }}</dd>

        <dt>First name</dt>
        <dd>{{ user.first_name }}</dd>

        <dt>Last name</dt>
        <dd>{{ user.last_name }}</dd>

        {% if user.bio %}
            <dt>Bio</dt>
            <dd>{{ user.bio }}</dd>
        {% endif %}
    </dl>
</section>
